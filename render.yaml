services:
  - type: web
    name: videodown
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && yt-dlp --update-to stable
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
